<button
  type="button"
  class="variant-card"
  [class.variant-card--selected]="selected()"
  [class.variant-card--inactive]="!selected()"
  [class.variant-card--first]="isFirst()"
  [class.variant-card--last]="isLast()"
  role="radio"
  [attr.aria-checked]="selected()"
  (click)="onSelect()"
>

  <img
    class="variant-card__image"
    [src]="imageSrc()"
    [alt]="variant().name"
    loading="lazy"
    width="80"
    height="80"
  >

  <div class="variant-card__content">

    <h3 class="variant-card__title">
      {{ variant().name }}
    </h3>

    <p class="variant-card__price">
      Desde S/ {{ variant().price.toFixed(2) }}
    </p>

  </div>

  <div class="variant-card__radio">
    @if (selected()) {
      <div class="variant-card__radio-inner"></div>
    }
  </div>

</button>
