<div class="gallery">
  <div class="gallery-thumbs">
    @for (image of images(); track image; let index = $index) {
      <button
        type="button"
        class="gallery-thumb"
        [class.gallery-thumb--active]="selectedIndex() === index"
        (click)="selectImage(index)"
      >
        <img
          [src]="image"
          [alt]="'Miniatura ' + (index + 1)"
          loading="lazy"
          width="80"
          height="80"
        >
      </button>
    }
  </div>

  <div class="gallery-main">
    @if (selectedImage()) {
      <img
        [src]="selectedImage()"
        alt="Imagen principal del producto"
        loading="eager"
        fetchpriority="high"
        width="600"
        height="600"
      >
    }
  </div>
</div>
